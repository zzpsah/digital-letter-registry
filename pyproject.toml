[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-letter-registry"
version = "0.1.0"
description = "Domain foundations for a private official letter intelligence archive."
requires-python = ">=3.12"
dependencies = [
  "pypdf>=5.0,<7",
  "fastapi[standard-no-fastapi-cloud-cli]>=0.142.2,<0.143.0",
  "python-multipart>=0.0.20,<0.1",
]

[tool.fastapi]
entrypoint = "letter_registry.api:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
letter_registry = ["web/*.html", "web/*.webmanifest", "web/*.js"]

# Repository-local Development OS durable context synchronizer.
name: Development OS Context Sync

on:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: devos-context-sync-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[devos-context-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize durable project context
        env:
          DEVOS_CONTEXT_DIRECTORY: .ai
          DEVOS_BEFORE_SHA: ${{ github.event.before }}
          DEVOS_MEANINGFUL_PATTERNS: src/**,app/**,pages/**,components/**,api/**,lib/**,public/**,supabase/**,migrations/**,prisma/**,db/**,database/**,package.json,package-lock.json,pnpm-lock.yaml,yarn.lock,pyproject.toml,requirements.txt,poetry.lock,Cargo.toml,Cargo.lock,go.mod,go.sum,composer.json,pom.xml,build.gradle,Dockerfile,*.csproj,*.sln,.github/workflows/**
        run: python .github/scripts/context-sync.py
